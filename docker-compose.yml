services:
  db:
    image: pgvector/pgvector:pg17
    container_name: bdtax-pgvector
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: ragdb
    ports:
      # 5433 on the host — avoids clashing with the pharmacy-pos database
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdb"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
